name: Build and Deploy Documentation

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # action-setup v6 requires an explicit version and reads the
          # repository root by default. This project has no root
          # package.json -- the packageManager key lives in docs/.
          package_json_file: docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install pnpm dependencies
        working-directory: ./docs
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        working-directory: ./docs
        run: pnpm run build

      # GitHub Pages serves static files, so a client-routed path like
      # /configuration has no file on disk and would 404 on direct
      # navigation. Pages serves 404.html for unmatched paths, so shipping
      # a copy of index.html there lets the Angular router resolve the
      # route client-side instead.
      - name: Add SPA fallback for client-side routes
        working-directory: ./docs
        run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist/docs/browser

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

